name: Replace main repo with profilo contents

on:
  push:
    paths:
      - ".github/workflows/sync-from-profilo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy profilo repository contents
        run: |
          git clone --depth 1 https://github.com/commmercial/profilo.git /tmp/profilo
          rsync -a --delete --exclude='.git' /tmp/profilo/ ./
      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace main repo contents with profilo"
          git push
